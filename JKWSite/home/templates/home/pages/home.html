{% extends "home/pages/page.html" %}
{% load static wagtailcore_tags jkwtags %}
{% block extra_css %}
        <link rel="stylesheet" href="{% static 'css/swiper-bundle.min.css' %}" rel="stylesheet" media="screen" />
        {% endblock extra_css%}
{% block content %}
<main>
  {% for block in page.body %}
    <section {% if forloop.counter0|divisibleby:2 %}class="highlighted"{% endif %}>
      {% include_block block %}
    </section>
  {% endfor %}
</main>
{% endblock content %}
