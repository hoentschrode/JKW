{% load wagtailcore_tags wagtailimages_tags %}
{% if self.background_image %}
  {% image self.background_image format-png fill-500x500-c100 as backgroundImage %}
  <style>
    :root {
      --heroBgImage: url('{{backgroundImage.url}}');
    }
  </style>
{% endif %}
<div class="hero d-flex align-items-center">
  {% for block in self.content %}
    {% include_block block %}
  {% endfor %}
</div>
